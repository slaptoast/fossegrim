name: Release

# Publishing is version-tag-driven, not automatic on every push to main:
#   git tag v1.2.3 && git push origin v1.2.3
# builds once and pushes the app and its proxy to GHCR (ghcr.io), tagged 1.2.3, 1.2, 1,
# and (for a non-prerelease tag) latest, then creates a GitHub Release with
# notes generated from the pull requests merged since the last one. A
# pull_request still gets a build-only sanity check with nothing pushed.

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fossegrim
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
            type=sha,format=short
          flavor: |
            latest=auto

      # For 64-bit ARM (e.g. a Raspberry Pi), the runtime stage runs under
      # QEMU; the .NET build itself doesn't (see the Dockerfile).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The nginx proxy in front of the app (proxy/), tagged the same way.
      - name: Derive proxy image metadata
        id: proxy-meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fossegrim-proxy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
            type=sha,format=short
          flavor: |
            latest=auto

      - name: Build and push proxy
        uses: docker/build-push-action@v6
        with:
          context: proxy
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.proxy-meta.outputs.tags }}
          labels: ${{ steps.proxy-meta.outputs.labels }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy

      # Only after the image is pushed, so a release never points at an image
      # that doesn't exist. Tags with a hyphen (v1.2.3-rc.1) are prereleases.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" --verify-tag --generate-notes $prerelease \
            --title "Fossegrim $TAG" \
            --notes "Docker images: \`ghcr.io/${{ github.repository_owner }}/fossegrim:$VERSION\` and \`ghcr.io/${{ github.repository_owner }}/fossegrim-proxy:$VERSION\`"
