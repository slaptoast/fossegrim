name: Release

# Publishing is version-tag-driven, not automatic on every push to main:
#   git tag v1.2.3 && git push origin v1.2.3
# builds once and pushes the app and its proxy to GHCR (ghcr.io) and Docker
# Hub (docker.io), tagged 1.2.3, 1.2, 1, and (for a non-prerelease tag)
# latest, then creates a GitHub Release with notes generated from the pull
# requests merged since the last one. A pull_request still gets a build-only
# sanity check with nothing pushed.
#
# Docker Hub needs two repo secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a personal access token with Read, Write, Delete scope; Delete is what
# lets the README sync below update the repository descriptions).

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/fossegrim
            docker.io/fossegrimmy/fossegrim
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
            type=sha,format=short
          flavor: |
            latest=auto

      # For 64-bit ARM (e.g. a Raspberry Pi), the runtime stage runs under
      # QEMU; the .NET build itself doesn't (see the Dockerfile).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The nginx proxy in front of the app (proxy/), tagged the same way.
      - name: Derive proxy image metadata
        id: proxy-meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/fossegrim-proxy
            docker.io/fossegrimmy/fossegrim-proxy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
            type=sha,format=short
          flavor: |
            latest=auto

      - name: Build and push proxy
        uses: docker/build-push-action@v7
        with:
          context: proxy
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.proxy-meta.outputs.tags }}
          labels: ${{ steps.proxy-meta.outputs.labels }}
          cache-from: type=gha,scope=proxy
          cache-to: type=gha,mode=max,scope=proxy

      # Docker Hub repository pages show their own README, which doesn't
      # follow the repo's. Refresh both on a stable release, so the page
      # matches what `latest` is. Relative links are made absolute so they
      # point back at GitHub.
      - name: Sync README to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: fossegrimmy/fossegrim
          short-description: A self-hosted music server and web player for the music collection you already own
          readme-filepath: README.md
          enable-url-completion: true

      - name: Sync proxy README to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: fossegrimmy/fossegrim-proxy
          short-description: The nginx proxy that runs in front of Fossegrim, with HTTPS
          readme-filepath: proxy/README.md
          enable-url-completion: true

      # Only after the image is pushed, so a release never points at an image
      # that doesn't exist. Tags with a hyphen (v1.2.3-rc.1) are prereleases.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" --verify-tag --generate-notes $prerelease \
            --title "Fossegrim $TAG" \
            --notes "Docker images: \`ghcr.io/${{ github.repository_owner }}/fossegrim:$VERSION\` and \`ghcr.io/${{ github.repository_owner }}/fossegrim-proxy:$VERSION\`, also on Docker Hub as \`fossegrimmy/fossegrim:$VERSION\` and \`fossegrimmy/fossegrim-proxy:$VERSION\`"
