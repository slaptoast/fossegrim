services:
  fossegrim:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/slaptoast/fossegrim:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in your .env file to a long random secret}
      Jwt__Issuer: ${JWT_ISSUER:-Fossegrim}
      Jwt__Audience: ${JWT_AUDIENCE:-FossegrimClients}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-10080}
    volumes:
      - fossegrim-data:/data
      - ${MUSIC_LIBRARY_PATH:-./music}:/music:ro

volumes:
  fossegrim-data:
