services:
  fossegrim:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/slaptoast/fossegrim:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Optional: left empty, a key is generated into /data/jwt.key on first run.
      Jwt__Key: ${JWT_KEY:-}
      Jwt__Issuer: ${JWT_ISSUER:-Fossegrim}
      Jwt__Audience: ${JWT_AUDIENCE:-FossegrimClients}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-10080}
      LastFm__ApiKey: ${LASTFM_API_KEY:-}
      LastFm__ApiSecret: ${LASTFM_API_SECRET:-}
    volumes:
      - fossegrim-data:/data
      # Read-write: the app edits ID3 tags in place and will eventually
      # write fetched album art alongside the audio files.
      - ${MUSIC_LIBRARY_PATH:-./music}:/music
      # Backup zips (database + keys). Point this somewhere off the data
      # volume -- ideally another disk -- so a backup survives losing /data.
      - ${BACKUP_PATH:-./backups}:/backups

volumes:
  fossegrim-data:
