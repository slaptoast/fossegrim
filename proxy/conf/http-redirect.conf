# Plain HTTP while there's a certificate: everything moves to HTTPS except
# Let's Encrypt's checks, which always come over plain HTTP.
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        include /etc/fossegrim-proxy/proxy-params.conf;
    }

    location / {
        return 301 https://$host@HTTPS_SUFFIX@$request_uri;
    }
}
